<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfume</title>

    <style>
        body {
            margin: 0;
            padding: 25px 50px;
            font-family: "Times New Roman", serif;
            background-color: #fff0f5;
            color: #4a2635;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 35px;
            color: #b04a72;
        }

        hr {
            border: none;
            border-top: 1px solid #d9a3b7;
            margin-bottom: 18px;
        }

        p {
            font-size: 18px;
            margin: 0 0 20px 0;
        }

        table {
            border-collapse: collapse;
            width: 320px;
            border: 3px double #c27b98;
            background-color: #fff8fa;
        }

        th {
            border: 2px solid #d9a3b7;
            text-align: left;
            padding: 8px;
            font-size: 18px;
            font-weight: normal;
            background-color: #f8dce7;
        }

        td {
            border: 2px solid #d9a3b7;
            padding: 8px;
            font-size: 18px;
        }

        .description {
            width: 150px;
            height: 150px;
            vertical-align: middle;
        }

        .image-cell {
            width: 150px;
            height: 150px;
            text-align: center;
            vertical-align: middle;
        }

        .image-cell img {
            width: 130px;
            height: 140px;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Perfume</h1>

    <hr>

    <p>Discover the beauty of perfumes</p>

    <hr>

    <table>

        <tr>
            <th>Description</th>
            <th>Image</th>
        </tr>

        <tr>
            <td class="description">
                <b>Pink Perfume</b>
                <br><br>
                A beautiful fragrance
                with a soft and elegant scent.
            </td>

            <td class="image-cell">
                <img src="image/perfume.jpg" alt="Pink Perfume">
            </td>
        </tr>

    </table> 
    <hr>
    <a href="details.html">Click here for perfume detaile </a>

</body>
</html>
